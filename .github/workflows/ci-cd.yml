name: CI/CD Reservasi Tambak Garam

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cache_strategy:
        description: "Pilih strategi caching untuk pengujian"
        required: true
        default: "full-cache"
        type: choice
        options:
          - no-cache
          - dependency-cache
          - full-cache

permissions:
  contents: read
  packages: write

env:
  STRATEGY: ${{ inputs.cache_strategy || vars.CACHE_STRATEGY || 'full-cache' }}

jobs:
  test:
    name: "1. Unit Test (Strategy: ${{ inputs.cache_strategy || vars.CACHE_STRATEGY || 'full-cache' }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore/Save Pip Cache
        if: env.STRATEGY != 'no-cache'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies (No Cache)
        if: env.STRATEGY == 'no-cache'
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir -r requirements.txt

      - name: Install dependencies (With Pip Cache)
        if: env.STRATEGY != 'no-cache'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (pytest)
        run: pytest -v

  build:
    name: "2. Build & Push Image (Strategy: ${{ inputs.cache_strategy || vars.CACHE_STRATEGY || 'full-cache' }})"
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Image Name (lowercase)
        id: meta
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "image_uri=${IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (No Docker Layer Cache)
        if: env.STRATEGY != 'full-cache'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Build and Push Image (With GHA Layer Cache)
        if: env.STRATEGY == 'full-cache'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "3. Deploy & Health Check"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .env file from GitHub Secrets
        run: |
          cat << 'EOF' > .env
          APP_IMAGE=${{ needs.build.outputs.image_uri }}
          APP_PORT=8080
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      - name: Pull Latest Image & Deploy Container
        run: |
          docker compose pull web
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Verify Application Health Check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "Health check berhasil!"
              exit 0
            fi
            echo "Menunggu aplikasi siap ($i/15)..."
            sleep 2
          done
          echo "Health check gagal setelah 30 detik."
          docker compose logs --tail=30 web
          exit 1